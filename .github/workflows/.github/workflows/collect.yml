name: Collect prices

on:
  schedule:
    # every 6 hours; Best Buy changes Black Friday prices several times a day
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices from the Best Buy API
        env:
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
        run: python3 collector/collect.py
      - name: Commit changed data
        run: |
          git config user.name "dinho-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "Prices $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
